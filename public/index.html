<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Steel Form — персональный тренер Михаил</title>

  <meta
    name="description"
    content="Steel Form — персональные тренировки с тренером Михаилом. Сила, форма и результат."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #080808;
      color: #fff;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.88);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #222;
    }

    .header-inner {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #f3c623;
    }

    nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    nav a {
      color: #aaa;
      font-size: 14px;
      transition: 0.2s;
    }

    nav a:hover {
      color: #fff;
    }

    .header-button {
      background: #f3c623;
      color: #000;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 800;
      border: 0;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding-top: 150px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: #f3c623;
      opacity: 0.08;
      filter: blur(120px);
      border-radius: 50%;
      right: -150px;
      top: 100px;
    }

    .hero-content {
      max-width: 780px;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      border: 1px solid #333;
      background: #111;
      padding: 8px 14px;
      border-radius: 100px;
      color: #f3c623;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 100px);
      line-height: 0.92;
      letter-spacing: -5px;
      font-weight: 950;
      margin-bottom: 28px;
    }

    h1 span {
      color: #f3c623;
    }

    .hero-text {
      max-width: 600px;
      color: #aaa;
      font-size: 19px;
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-button {
      border: 0;
      background: #f3c623;
      color: #000;
      padding: 16px 25px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-2px);
    }

    .secondary-button {
      border: 1px solid #333;
      background: #111;
      color: #fff;
      padding: 16px 25px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* SECTIONS */

    section {
      padding: 100px 0;
      border-top: 1px solid #181818;
    }

    .section-title {
      font-size: clamp(35px, 6vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 15px;
    }

    .section-subtitle {
      color: #888;
      max-width: 600px;
      margin-bottom: 45px;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 20px;
      padding: 30px;
      transition: 0.25s;
    }

    .card:hover {
      border-color: #444;
      transform: translateY(-4px);
    }

    .card-number {
      color: #f3c623;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 45px;
    }

    .card h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .card p {
      color: #888;
      font-size: 15px;
    }

    /* TRAINER */

    .trainer {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 50px;
      align-items: center;
    }

    .trainer-photo {
      min-height: 500px;
      border-radius: 25px;
      background:
        radial-gradient(circle at 50% 25%, #555, transparent 20%),
        linear-gradient(145deg, #202020, #080808);
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .trainer-photo span {
      font-size: 100px;
      font-weight: 950;
      color: #f3c623;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    .trainer h2 {
      font-size: clamp(40px, 6vw, 65px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .trainer p {
      color: #999;
      margin-bottom: 25px;
      max-width: 600px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .fact {
      background: #111;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 18px;
    }

    .fact strong {
      display: block;
      color: #f3c623;
      font-size: 25px;
    }

    .fact small {
      color: #777;
    }

    /* FORM */

    .form-section {
      background: #0d0d0d;
    }

    .form-box {
      max-width: 650px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 35px;
    }

    .form-box h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .form-box > p {
      color: #888;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 15px;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: #f3c623;
    }

    .form-submit {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: 0;
      border-radius: 11px;
      background: #f3c623;
      color: #000;
      font-weight: 900;
      cursor: pointer;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #162116;
      color: #8ee28e;
    }

    /* FOOTER */

    footer {
      padding: 45px 0;
      border-top: 1px solid #222;
      color: #666;
      font-size: 14px
